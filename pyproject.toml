[project]
name = "kb-agent"
version = "0.1.0"
description = "带引用的本地知识库 Agent:BM25 检索 + tool calling,CLI 与 Web 双入口"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["rag", "agent", "bm25", "knowledge-base", "fastapi", "llm"]
dependencies = [
    "agent-lab @ git+https://github.com/westsonGoogle/agent-lab.git@67c24ec1b7ed2940cf9bb9486954adfe6180b3dd",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.scripts]
kb = "kbagent.cli:main"

[project.urls]
Homepage = "https://github.com/westsonGoogle/kb-agent"
Repository = "https://github.com/westsonGoogle/kb-agent"
Issues = "https://github.com/westsonGoogle/kb-agent/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbagent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
