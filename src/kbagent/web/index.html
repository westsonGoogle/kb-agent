<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>kb-agent · 本地知识库</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --text: #17181c;
    --muted: #6b7280;
    --line: #e6e7ee;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --panel: #161922;
      --text: #e8eaf0;
      --muted: #9aa1b2;
      --line: #262b38;
      --accent: #818cf8;
      --accent-soft: #1e2340;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 292px 1fr; height: 100dvh; }

  /* ---------- 侧栏 ---------- */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand { padding: 20px 20px 4px; font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  .sub { padding: 0 20px 10px; font-size: 12px; color: var(--muted); }

  .upload {
    margin: 10px 16px 14px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--muted);
    cursor: pointer;
    transition: .16s ease;
  }
  .upload strong { color: var(--text); font-size: 13px; }
  .upload:hover, .upload.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .upload.drag strong { color: var(--accent); }

  .docs-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 20px 8px; font-size: 11px; color: var(--muted);
    letter-spacing: .08em; text-transform: uppercase;
  }
  #docs { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .doc {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 8px 10px; border-radius: 9px; font-size: 13px;
  }
  .doc:hover { background: var(--bg); }
  .doc .name { flex: 1; min-width: 0; word-break: break-all; line-height: 1.35; }
  .doc .meta { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .doc .del {
    border: 0; background: transparent; color: var(--muted); font-size: 16px;
    line-height: 1; padding: 2px 4px; border-radius: 6px; cursor: pointer; opacity: 0;
  }
  .doc:hover .del, .doc .del:focus { opacity: 1; }
  .doc .del:hover { color: var(--danger); background: var(--bg); }
  .empty { padding: 18px 12px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.7; }

  .side-foot { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  .hint { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-top: 8px; }

  /* ---------- 主区 ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    height: 58px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(10px);
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }
  .dot.busy { background: #f59e0b; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #chat { flex: 1; overflow-y: auto; padding: 26px 20px 6px; scroll-behavior: smooth; }
  .thread { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .avatar {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px;
    display: grid; place-items: center; font-size: 13px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .bubble {
    max-width: min(720px, 100%); padding: 12px 15px; font-size: 14.5px;
    line-height: 1.72; border-radius: 4px 14px 14px 14px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .03); overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: var(--accent); color: #fff; border-color: transparent;
    border-radius: 14px 14px 4px 14px; white-space: pre-wrap;
  }
  .content { white-space: pre-wrap; }
  .content.error { color: var(--danger); }
  .content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 5px;
  }
  sup.cite {
    color: var(--accent); font-weight: 700; font-size: 11px; cursor: pointer;
    padding: 0 2px; user-select: none;
  }

  .tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .tool {
    display: inline-flex; align-items: center; gap: 7px; width: fit-content;
    font-size: 12px; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 4px 11px;
  }
  .tool.done { color: var(--muted); background: transparent; border: 1px solid var(--line); }
  .spinner {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--accent); border-top-color: transparent;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .typing { display: flex; gap: 4px; padding: 4px 0 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .sources {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  .sources-title {
    font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }
  .source {
    display: flex; gap: 7px; align-items: baseline; width: 100%;
    border: 0; background: none; padding: 3px 0; cursor: pointer;
    font: inherit; font-size: 12.5px; color: var(--muted); text-align: left;
  }
  .source:hover { color: var(--accent); }
  .source.flash { color: var(--accent); font-weight: 600; }
  .cite-badge { color: var(--accent); font-weight: 700; flex: 0 0 auto; }
  .src-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-loc { flex: 0 0 auto; font-size: 11px; opacity: .8; }
  .snippet {
    display: none; margin: 2px 0 6px 22px; padding: 8px 10px; border-radius: 8px;
    background: var(--bg); color: var(--muted); font-size: 12px; line-height: 1.6;
  }
  .snippet.open { display: block; }

  .usage { margin-top: 8px; font-size: 11px; color: var(--muted); }

  .welcome { text-align: center; padding: 7vh 10px 24px; }
  .welcome .hero {
    width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px;
    display: grid; place-items: center; font-size: 26px;
    background: var(--accent-soft); color: var(--accent);
  }
  .welcome h1 { font-size: 21px; margin: 0 0 8px; letter-spacing: .2px; }
  .welcome p { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 660px; margin: 0 auto; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 8px 13px; font-size: 12.5px; cursor: pointer;
    transition: .15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 20px 16px; }
  .composer form {
    max-width: 840px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 8px 8px 14px;
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    color: var(--text); font: inherit; font-size: 14.5px; line-height: 1.55;
    max-height: 160px; padding: 6px 0;
  }
  .send {
    border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    font: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px;
    cursor: pointer; transition: .15s ease;
  }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .send:not(:disabled):hover { filter: brightness(1.08); }
  .foot { max-width: 840px; margin: 7px auto 0; font-size: 11px; color: var(--muted); text-align: center; }

  .ghost {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .ghost:hover { color: var(--accent); border-color: var(--accent); }
  .menu { display: none; border: 0; background: transparent; color: var(--text); font-size: 18px; cursor: pointer; padding: 2px 6px; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 9px 15px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .12); opacity: 0; pointer-events: none;
    transition: .2s ease; z-index: 50; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.err { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside {
      position: fixed; inset: 0 auto 0 0; width: 286px; z-index: 30;
      transform: translateX(-100%); transition: transform .2s ease;
      box-shadow: 0 0 40px rgba(0, 0, 0, .18);
    }
    .app.show-docs aside { transform: none; }
    .menu { display: inline-block; }
    #chat { padding: 18px 12px 6px; }
    .bubble { max-width: 100%; }
    .composer { padding: 8px 12px 12px; }
    .msg.user .bubble { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand">kb<span>-</span>agent</div>
    <div class="sub">本地知识库 · 每个回答都有出处</div>

    <label class="upload" id="drop">
      <input type="file" id="fileInput" multiple hidden
             accept=".md,.markdown,.txt,.pdf,.docx">
      <strong>上传文档</strong><br>
      拖拽到此处,或点击选择<br>
      md / txt / pdf / docx
    </label>

    <div class="docs-head"><span>文档</span><span id="docStats">加载中…</span></div>
    <div id="docs"></div>

    <div class="side-foot">
      <button class="ghost" id="reindexBtn" style="width:100%">重建索引</button>
      <div class="hint">检索使用 BM25(中文 bigram),回答只依据这些文档。</div>
    </div>
  </aside>

  <main>
    <header>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu" id="menuBtn" aria-label="文档列表">☰</button>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">就绪</span></div>
      </div>
      <button class="ghost" id="newChat">新对话</button>
    </header>

    <div id="chat">
      <div class="thread" id="thread">
        <div class="welcome" id="welcome">
          <div class="hero">📚</div>
          <h1>问点什么,它只依据你的文档回答</h1>
          <p>先检索、再回答,每个结论都带 [n] 来源,点开可核对原文。</p>
          <div class="chips">
            <button class="chip" data-q="Agent 的本质是什么?为什么说它是一个 while 循环?">Agent 的本质</button>
            <button class="chip" data-q="prompt caching 怎么才能命中?有哪些常见破坏因素?">prompt caching</button>
            <button class="chip" data-q="uv 和 pip + venv 有什么区别?为什么推荐 uv?">uv 工作流</button>
            <button class="chip" data-q="线上接口大面积 500 应该按什么顺序排查?">500 排查</button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <form id="form">
        <textarea id="input" rows="1" placeholder="问问你的文档,例如:缓存命中率怎么提升?"></textarea>
        <button class="send" id="sendBtn" type="submit">发送</button>
      </form>
      <div class="foot">Enter 发送 · Shift+Enter 换行 · 资料没有时会明确说不知道</div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = (selector, root = document) => root.querySelector(selector);
  const thread = $("#thread");
  const chat = $("#chat");
  const input = $("#input");
  const sendBtn = $("#sendBtn");
  const docsEl = $("#docs");
  const docStats = $("#docStats");

  const state = { sessionId: null, streaming: false, welcome: $("#welcome")?.outerHTML || "" };
  let toastTimer = null;

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (ch) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
    ));

  function formatAnswer(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\[(\d+)\]/g, '<sup class="cite" data-cite="$1">[$1]</sup>');
    return html;
  }

  function scrollToEnd() {
    requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
  }

  function toast(message, isError = false) {
    const el = $("#toast");
    el.textContent = message;
    el.className = "show" + (isError ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ""; }, 3200);
  }

  function setStatus(text, busy = false) {
    $("#statusText").textContent = text;
    $("#dot").classList.toggle("busy", busy);
  }

  function fmtSize(bytes) {
    if (!bytes) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }

  // ---------- 文档 ----------
  async function loadDocs() {
    try {
      const response = await fetch("/api/documents");
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      docStats.textContent = `${data.documents.length} 份 · ${data.chunks} 片段`;
      docsEl.innerHTML = "";
      if (!data.documents.length) {
        docsEl.innerHTML = '<div class="empty">还没有文档<br>上传一份 md / txt / pdf / docx 开始</div>';
        return;
      }
      for (const doc of data.documents) {
        const row = document.createElement("div");
        row.className = "doc";
        const name = document.createElement("div");
        name.className = "name";
        name.innerHTML = `<div>${escapeHtml(doc.source)}</div>` +
          `<div class="meta">${doc.chunk_count} 片段 · ${fmtSize(doc.size)}</div>`;
        const del = document.createElement("button");
        del.className = "del";
        del.title = "删除";
        del.textContent = "×";
        del.addEventListener("click", async () => {
          if (!confirm(`删除《${doc.source}》?文件也会一并删除。`)) return;
          const response = await fetch(`/api/documents/${doc.id}`, { method: "DELETE" });
          if (!response.ok) return toast("删除失败", true);
          await loadDocs();
          toast("已删除");
        });
        row.append(name, del);
        docsEl.append(row);
      }
    } catch (error) {
      docStats.textContent = "加载失败";
      toast("文档列表加载失败:" + error.message, true);
    }
  }

  async function uploadFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    for (const file of files) {
      const data = new FormData();
      data.append("file", file);
      setStatus(`上传 ${file.name}…`, true);
      try {
        const response = await fetch("/api/upload", { method: "POST", body: data });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || "上传失败");
        toast(`已索引 ${payload.source}(${payload.chunk_count} 片段)`);
      } catch (error) {
        toast(`${file.name}:${error.message}`, true);
      }
    }
    await loadDocs();
    setStatus("就绪");
  }

  $("#fileInput").addEventListener("change", (event) => uploadFiles(event.target.files));

  const drop = $("#drop");
  ["dragenter", "dragover"].forEach((name) =>
    drop.addEventListener(name, (event) => {
      event.preventDefault();
      drop.classList.add("drag");
    })
  );
  ["dragleave", "drop"].forEach((name) =>
    drop.addEventListener(name, (event) => {
      event.preventDefault();
      drop.classList.remove("drag");
    })
  );
  drop.addEventListener("drop", (event) => uploadFiles(event.dataTransfer.files));

  $("#reindexBtn").addEventListener("click", async () => {
    setStatus("重建索引…", true);
    try {
      const response = await fetch("/api/reindex", { method: "POST" });
      const stats = await response.json();
      if (!response.ok) throw new Error(stats.detail || "重建失败");
      toast(`已重建:${stats.indexed} 份文档 / ${stats.chunks} 片段`);
      if (stats.errors && stats.errors.length) {
        toast(`有 ${stats.errors.length} 份文档失败,见服务端日志`, true);
      }
      await loadDocs();
    } catch (error) {
      toast(error.message, true);
    }
    setStatus("就绪");
  });

  // ---------- 消息渲染 ----------
  function addUser(text) {
    const row = document.createElement("div");
    row.className = "msg user";
    row.innerHTML = '<div class="avatar">你</div><div class="bubble"></div>';
    row.querySelector(".bubble").textContent = text;
    thread.append(row);
    scrollToEnd();
  }

  function addAssistant() {
    const row = document.createElement("div");
    row.className = "msg assistant";
    row.innerHTML =
      '<div class="avatar">✦</div>' +
      '<div class="bubble">' +
      '<div class="tools"></div>' +
      '<div class="content"></div>' +
      '<div class="typing"><i></i><i></i><i></i></div>' +
      '</div>';
    thread.append(row);
    scrollToEnd();
    return {
      row,
      bubble: row.querySelector(".bubble"),
      content: row.querySelector(".content"),
      tools: row.querySelector(".tools"),
      typing: row.querySelector(".typing"),
      pills: new Map(),
      text: "",
      done: false,
      usage: null,
    };
  }

  function updateTool(turn, payload) {
    const args = payload.arguments || {};
    let label = "调用 " + payload.name;
    if (payload.name === "search_kb") label = `检索「${args.query || ""}」`;
    else if (payload.name === "open_document") label = `打开 ${args.source || ""}`;
    else if (payload.name === "list_documents") label = "列出文档";

    const pill = document.createElement("div");
    pill.className = "tool";
    pill.innerHTML = '<span class="spinner"></span><span class="label"></span>';
    pill.querySelector(".label").textContent = label;
    turn.tools.append(pill);
    turn.pills.set(payload.call_id, pill);
    setStatus(payload.name === "search_kb" ? "检索中…" : "调用工具…", true);
    scrollToEnd();
  }

  function completeTool(turn, payload) {
    const pill = turn.pills.get(payload.call_id);
    if (!pill) return;
    let label = "完成";
    if (payload.name === "search_kb") {
      try {
        const data = JSON.parse(payload.result);
        label = data.count ? `命中 ${data.count} 段` : "没有命中";
      } catch { label = "检索完成"; }
    } else if (payload.name === "open_document") {
      label = "已打开文档";
    } else if (payload.name === "list_documents") {
      label = "已列出文档";
    }
    pill.classList.add("done");
    const spinner = pill.querySelector(".spinner");
    if (spinner) spinner.replaceWith(document.createTextNode("✓"));
    pill.querySelector(".label").textContent = label;
  }

  function renderSources(turn, sources) {
    if (!sources || !sources.length) return;
    if (turn.row.querySelector(".sources")) return;

    const cited = new Set(
      [...(turn.text || "").matchAll(/\[(\d+)\]/g)].map((match) => String(match[1]))
    );
    const visible = cited.size
      ? sources.filter((source) => cited.has(String(source.cite)))
      : sources.slice(0, 5);
    if (!visible.length) return;

    const wrap = document.createElement("div");
    wrap.className = "sources";
    const title = document.createElement("div");
    title.className = "sources-title";
    title.textContent = "参考来源";
    wrap.append(title);

    for (const source of visible) {
      const button = document.createElement("button");
      button.className = "source";
      button.dataset.cite = source.cite;
      button.innerHTML =
        `<span class="cite-badge">[${source.cite}]</span>` +
        '<span class="src-name"></span>' +
        '<span class="src-loc"></span>';
      button.querySelector(".src-name").textContent = source.source;
      button.querySelector(".src-loc").textContent = source.location;

      const snippet = document.createElement("div");
      snippet.className = "snippet";
      snippet.textContent = source.snippet;

      button.addEventListener("click", () => snippet.classList.toggle("open"));
      wrap.append(button, snippet);
    }
    turn.bubble.append(wrap);
    scrollToEnd();
  }

  function finishTurn(turn, text, isError = false) {
    if (turn.done) return;
    turn.done = true;
    if (turn.typing) turn.typing.remove();
    if (isError) {
      turn.content.classList.add("error");
      turn.content.textContent = text;
    } else {
      turn.content.innerHTML = formatAnswer(text || "(没有返回内容)");
    }
    if (turn.usage) {
      const usage = document.createElement("div");
      usage.className = "usage";
      usage.textContent =
        `输入 ${turn.usage.prompt_tokens} tokens` +
        (turn.usage.cached_tokens ? `(缓存 ${turn.usage.cached_tokens})` : "") +
        ` · 输出 ${turn.usage.completion_tokens}`;
      turn.bubble.append(usage);
    }
    scrollToEnd();
  }

  function handleEvent(payload, turn) {
    switch (payload.type) {
      case "session":
        state.sessionId = payload.session_id;
        break;
      case "text":
        turn.text += payload.text || "";
        if (turn.typing) { turn.typing.remove(); turn.typing = null; }
        turn.content.textContent = turn.text;
        setStatus("生成中…", true);
        scrollToEnd();
        break;
      case "reasoning":
        break;
      case "tool_call":
        updateTool(turn, payload);
        break;
      case "tool_result":
        completeTool(turn, payload);
        break;
      case "usage":
        turn.usage = payload.usage || null;
        break;
      case "sources":
        renderSources(turn, payload.sources);
        break;
      case "done":
        finishTurn(turn, payload.text || turn.text);
        setStatus("就绪");
        break;
      case "error":
        finishTurn(turn, "出错了:" + (payload.error || "未知错误"), true);
        setStatus("就绪");
        break;
      case "end":
        setStatus("就绪");
        break;
    }
  }

  // ---------- 发送 ----------
  async function send(text) {
    text = (text || "").trim();
    if (!text || state.streaming) return;

    state.streaming = true;
    sendBtn.disabled = true;
    const welcome = $("#welcome");
    if (welcome) welcome.remove();

    addUser(text);
    const turn = addAssistant();
    input.value = "";
    autoGrow();
    setStatus("思考中…", true);

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: state.sessionId }),
      });
      if (!response.ok || !response.body) {
        let detail = "HTTP " + response.status;
        try { detail = (await response.json()).detail || detail; } catch {}
        throw new Error(detail);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        for (const block of blocks) {
          const lines = block.split("\n").filter((line) => line.startsWith("data:"));
          if (!lines.length) continue;
          let payload;
          try {
            payload = JSON.parse(lines.map((line) => line.slice(5).trim()).join("\n"));
          } catch { continue; }
          handleEvent(payload, turn);
        }
      }
    } catch (error) {
      finishTurn(turn, "请求失败:" + error.message, true);
    } finally {
      state.streaming = false;
      sendBtn.disabled = false;
      setStatus("就绪");
      if (!turn.done) finishTurn(turn, turn.text);
    }
  }

  $("#form").addEventListener("submit", (event) => {
    event.preventDefault();
    send(input.value);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      send(input.value);
    }
  });

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoGrow);

  document.addEventListener("click", (event) => {
    const chip = event.target.closest("[data-q]");
    if (chip) send(chip.dataset.q);

    const cite = event.target.closest("sup.cite");
    if (cite) {
      const row = cite.closest(".msg");
      const target = row?.querySelector(`.source[data-cite="${cite.dataset.cite}"]`);
      if (target) {
        target.classList.add("flash");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        setTimeout(() => target.classList.remove("flash"), 1200);
        target.nextElementSibling?.classList.add("open");
      }
    }
  });

  $("#newChat").addEventListener("click", () => {
    state.sessionId = null;
    state.streaming = false;
    sendBtn.disabled = false;
    thread.innerHTML = state.welcome;
    setStatus("就绪");
    input.focus();
  });

  $("#menuBtn").addEventListener("click", () => {
    $("#app").classList.toggle("show-docs");
  });

  loadDocs();
  input.focus();
})();
</script>
</body>
</html>
